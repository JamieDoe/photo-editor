[package]
name = "raw"
description = "Source decoding behind a decoder abstraction (LibRaw for camera RAW; zune-jpeg, png and tiff for rendered images)."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
build = "build.rs"
links = "raw_r"

[features]
default = ["libraw", "turbojpeg"]
# Camera RAW support via the system LibRaw (LGPL-2.1 OR CDDL-1.0), dynamically linked.
# See docs/ADR/0003-raw-decoder.md.
libraw = ["dep:cc"]
# Decode embedded RAW previews with libjpeg-turbo's DCT-domain scaling (ADR 0007).
# Without it, embedded JPEGs are decoded at full size with zune-jpeg.
turbojpeg = ["dep:jpeg-turbo"]

[dependencies]
image-core.workspace = true
rayon.workspace = true
zune-jpeg.workspace = true
# EXIF for JPEGs (BSD-2-Clause, pure Rust). RAW metadata comes from LibRaw.
kamadak-exif = "0.6"
# PNG and TIFF input (ADR 0076): pure Rust, MIT/Apache-2.0 and MIT, already used for
# export. TIFF reading adds LZW (weezl, MIT/Apache-2.0) and JPEG-in-TIFF (zune-jpeg,
# already used); fax compression (black-and-white documents) is left out.
png.workspace = true
tiff = { workspace = true, features = ["lzw", "jpeg"] }
jpeg-turbo = { workspace = true, optional = true }

[build-dependencies]
cc = { workspace = true, optional = true }

[dev-dependencies]
fixtures.workspace = true
