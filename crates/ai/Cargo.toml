[package]
name = "ai"
description = "Optional AI subsystem (ADR 0074): masks generated from a photo, behind one interface."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

# Apple Vision (ADR 0074): the system's own models, nothing shipped. The bindings are
# the objc2 project's (Zlib OR Apache-2.0 OR MIT), as Tauri's already are; only the
# headers used are enabled.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSArray", "NSDictionary", "NSError", "NSIndexSet", "NSProcessInfo", "NSString", "NSValue"] }
objc2-core-foundation = { version = "0.3", default-features = false, features = ["std", "CFCGTypes", "CFData", "CFString"] }
objc2-core-graphics = { version = "0.3", default-features = false, features = ["std", "CGColorSpace", "CGDataProvider", "CGImage"] }
objc2-core-video = { version = "0.3", default-features = false, features = ["std", "CVBase", "CVBuffer", "CVImageBuffer", "CVPixelBuffer", "CVReturn"] }
objc2-vision = { version = "0.3", default-features = false, features = [
    "std",
    "objc2-core-foundation",
    "objc2-core-graphics",
    "objc2-core-video",
    "VNGenerateForegroundInstanceMaskRequest",
    "VNDetectHumanRectanglesRequest",
    "VNGeneratePersonInstanceMaskRequest",
    "VNObservation",
    "VNRequest",
    "VNRequestHandler",
    "VNStatefulRequest",
    "VNTypes",
] }
