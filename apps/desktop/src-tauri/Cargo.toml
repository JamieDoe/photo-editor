[package]
name = "desktop"
description = "Tauri desktop shell: typed IPC between the React UI and the Rust engine."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
app-core.workspace = true
folders.workspace = true
image-core.workspace = true
log.workspace = true
renderer = { workspace = true, features = ["ts"] }
settings = { workspace = true, features = ["ts"] }
serde.workspace = true
serde_json.workspace = true
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-log = "2"
tauri-plugin-opener = "2"
ts-rs.workspace = true
tauri-plugin-window-state = "2"
tauri-plugin-single-instance = "2"

[dev-dependencies]
fixtures.workspace = true
