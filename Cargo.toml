[workspace]
resolver = "3"
members = [
    "crates/image-core",
    "crates/raw",
    "crates/renderer",
    "crates/cache",
    "crates/jobs",
    "crates/export",
    "crates/jpeg-turbo",
    "crates/platform",
    "crates/folders",
    "crates/catalogue",
    "crates/settings",
    "crates/app-core",
    "crates/fixtures",
    "crates/ai",
    "crates/bench",
    "crates/gpu-spike",
    "apps/desktop/src-tauri",
]
# The GPU spike pulls in wgpu; keep it out of the default build/test cycle.
default-members = [
    "crates/image-core",
    "crates/raw",
    "crates/renderer",
    "crates/cache",
    "crates/jobs",
    "crates/export",
    "crates/jpeg-turbo",
    "crates/platform",
    "crates/folders",
    "crates/catalogue",
    "crates/settings",
    "crates/app-core",
    "crates/fixtures",
    "crates/ai",
    "crates/bench",
    "apps/desktop/src-tauri",
]

[workspace.package]
version = "0.0.1"
edition = "2024"
license = "LicenseRef-Proprietary"
publish = false

[workspace.dependencies]
image-core = { path = "crates/image-core" }
raw = { path = "crates/raw" }
renderer = { path = "crates/renderer" }
cache = { path = "crates/cache" }
jobs = { path = "crates/jobs" }
export = { path = "crates/export" }
jpeg-turbo = { path = "crates/jpeg-turbo" }
platform = { path = "crates/platform" }
folders = { path = "crates/folders" }
catalogue = { path = "crates/catalogue" }
settings = { path = "crates/settings" }
app-core = { path = "crates/app-core" }
fixtures = { path = "crates/fixtures" }
ai = { path = "crates/ai" }

rayon = "1.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Reading Lightroom's .xmp presets (ADR 0047). MIT; already in the app through
# tauri -> plist.
quick-xml = "0.42"
zune-jpeg = "0.5"
jpeg-encoder = "0.7"
png = "0.18"
# 16-bit TIFF export (ADR 0057). MIT; pure Rust, from the image-rs project like png.
tiff = { version = "0.11", default-features = false, features = ["deflate"] }
ts-rs = "12"
cc = "1"
libc = "0.2"
log = "0.4"

[profile.dev]
# Pixel loops are unusably slow at opt-level 0; keep debug builds interactive.
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
debug = "line-tables-only"
